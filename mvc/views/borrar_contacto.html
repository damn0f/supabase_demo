$def with(contacto)

$if contacto != []:
    <h1>¿Seguro que deseas borrar este contacto?</h1>

    <form name="contacto" action="/borrar_contacto/$contacto[0]['id_contacto']" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" value="$contacto[0]['nombre']" readonly><br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="$contacto[0]['email']" readonly><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" name="telefono" id="telefono" value="$contacto[0]['telefono']" readonly><br>

        <input type="submit" value="Sí, borrar">
        <input type="button" onclick="location.href='/contactos';" value="Cancelar">
    </form>
$else:
    <h2>Contacto no encontrado</h2>
    <input type="button" onclick="location.href='/contactos';" value="Regresar">
