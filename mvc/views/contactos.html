$def with(datos)
<h1>Contactos</h1>

<table border="10">

    <thead>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Telefono</th>
    </thead>
    <tbody>
       $for contacto in datos:
        <tr>
            <td>$contacto['id_contacto']</td>
            <td>$contacto['nombre']</td>
            <td>$contacto['telefono']</td>
            <td>$contacto['email']</td>
        </tr>
    </tbody>

</table>
